# The Rust half of scripts/check-live.mjs, which starts rclone and runs this.

[package]
name = "check-live-rs"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rclone-sdk = { path = "../../rs" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
