[package]
name = "rclone-sdk"
version = "1.75.2"
edition = "2024"
license = "MIT"
description = "Full OpenAPI-based client for the Rclone RC API."
homepage = "https://rcloneui.com"
repository = "https://github.com/rclone-ui/rclone-sdk"
categories = ["api-bindings", "web-programming::http-client"]
keywords = ["rclone", "sdk", "openapi", "client"]
readme = "../README.md"

[dependencies]
base64 = "0.22"
bytes = "1.9"
chrono = { version = "0.4", default-features=false, features = ["serde"] }
futures-core = "0.3"
progenitor-client = "0.15.1"
reqwest = { version = "0.13", default-features=false, features = ["json", "query", "stream", "multipart", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

